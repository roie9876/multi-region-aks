#cloud-config
write_files:
  - path: /var/www/html/index.html
    permissions: "0644"
    content: |
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sweden Central</title>
        <style>
          body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background: #f7f4ef;
            color: #242424;
          }
          main {
            text-align: center;
            padding: 2.5rem 3rem;
            background: #ffffff;
            border: 2px solid #82b366;
            border-radius: 16px;
          }
          h1 {
            font-size: 3.5rem;
            margin: 0 0 0.5rem;
          }
          p {
            margin: 0;
            font-family: Consolas, monospace;
            color: #5c5c5c;
          }
        </style>
      </head>
      <body>
        <main>
          <h1>Sweden Central</h1>
          <p>Private HTTP probe (swedencentral)</p>
        </main>
      </body>
      </html>
  - path: /usr/local/sbin/setup-web-probe
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      mkdir -p /var/www/html
      if DEBIAN_FRONTEND=noninteractive apt-get update -y && DEBIAN_FRONTEND=noninteractive apt-get install -y nginx; then
        systemctl enable --now nginx
        exit 0
      fi
      cat <<'UNIT' > /etc/systemd/system/sweden-web-probe.service
      [Unit]
      Description=Sweden Central Private HTTP Probe (fallback when NGINX package source is unreachable)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/bin/python3 -m http.server 80 --directory /var/www/html
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target
      UNIT
      systemctl daemon-reload
      systemctl enable --now sweden-web-probe.service
runcmd:
  - ["/usr/local/sbin/setup-web-probe"]
