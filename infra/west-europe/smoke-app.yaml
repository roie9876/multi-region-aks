apiVersion: apps/v1
kind: Deployment
metadata:
  name: migration-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: migration-probe
  template:
    metadata:
      labels:
        app: migration-probe
    spec:
      containers:
        - name: http
          image: mcr.microsoft.com/azuredocs/aks-helloworld:v1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: migration-probe
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/"
spec:
  type: LoadBalancer
  selector:
    app: migration-probe
  ports:
    - port: 80
      targetPort: 80
