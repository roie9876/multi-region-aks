#cloud-config
package_update: true
packages:
  - strongswan
  - strongswan-swanctl
  - libcharon-extra-plugins
  - frr
  - iptables
  - iproute2
  - tcpdump
  - traceroute
  - bind9-dnsutils
  - jq
write_files:
  - path: /etc/sysctl.d/99-lab-router.conf
    permissions: "0644"
    content: |
      net.ipv4.ip_forward = 1
      net.ipv4.conf.all.rp_filter = 0
      net.ipv4.conf.default.rp_filter = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
  - path: /etc/strongswan.d/charon-xfrm.conf
    permissions: "0644"
    content: |
      charon {
        install_routes = no
        install_virtual_ip = no
      }
runcmd:
  - ["sysctl", "--system"]
