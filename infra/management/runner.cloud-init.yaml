#cloud-config
packages:
  - curl
  - unzip
  - git
write_files:
  - path: /usr/local/sbin/install-lab-terraform
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      workdir=$(mktemp -d)
      trap 'rm -f "$workdir/terraform.zip" "$workdir/terraform" "$workdir/LICENSE.txt"; rmdir "$workdir"' EXIT
      cd "$workdir"
      curl --fail --silent --show-error --retry 5 --location \
        https://releases.hashicorp.com/terraform/1.15.7/terraform_1.15.7_linux_amd64.zip \
        --output terraform.zip
      echo '73bbb8f5188ad75d4fb853fd100ae4d7e146ef7af7db18776109642fdb7759d2  terraform.zip' | sha256sum --check
      unzip -q terraform.zip terraform
      install -m 0755 terraform /usr/local/bin/terraform
      terraform version
runcmd:
  - ["/usr/local/sbin/install-lab-terraform"]
