<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title description">
  <title id="title">BGP cutover: West Europe to Israel Central</title>
  <desc id="description">West Europe advertises the AKS spoke /17 to Google Cloud and on-premises. West Europe withdraws it, and both peers confirm the old route is gone. Israel Central then advertises the same /17 to both peers. All four site-to-site VPN links stay up. The timing is illustrative.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #102a43; }
    .title { font-size: 30px; font-weight: 700; }
    .heading { font-size: 19px; font-weight: 700; }
    .body { font-size: 15px; }
    .note { font-size: 13px; fill: #334e68; }
    .node { fill: #ffffff; stroke: #9fb3c8; stroke-width: 1.5; }
    .hub { fill: #edf6ff; stroke: #79a5cf; }
    .vpn, .update { fill: none; stroke-width: 3; stroke-linejoin: round; }
    .vpn { stroke: #9fb3c8; }
    .update { stroke: #0078d4; marker-end: url(#advertise); }
    .withdraw { stroke: #9a5a00; marker-end: url(#withdraw); }
    .pulse { stroke: #fff; stroke-width: 2; stroke-dasharray: 4 20; marker-end: none; animation: travel 0.9s linear infinite; }
    .phase-two, .phase-three { visibility: hidden; }
    .phase-one { animation: before 18s step-end infinite; }
    .phase-two { animation: cutover 18s step-end infinite; }
    .phase-three { animation: after 18s step-end infinite; }
    @keyframes before { 0% { visibility: visible; } 33.333% { visibility: hidden; } }
    @keyframes cutover { 0% { visibility: hidden; } 33.333% { visibility: visible; } 61.111% { visibility: hidden; } }
    @keyframes after { 0% { visibility: hidden; } 61.111% { visibility: visible; } }
    @keyframes travel { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) {
      .phase-one, .phase-two, .phase-three, .pulse { animation: none; }
      .pulse { display: none; }
    }
  </style>
  <defs>
    <path id="west-gcp" d="M285 302 H330 V235 H375"/>
    <path id="west-onprem" d="M285 338 H330 V410 H375"/>
    <path id="israel-gcp" d="M675 302 H630 V235 H585"/>
    <path id="israel-onprem" d="M675 338 H630 V410 H585"/>
    <marker id="advertise" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0078d4"/>
    </marker>
    <marker id="withdraw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9a5a00"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="588" rx="18" fill="#f7fafc" stroke="#bcccdc"/>
  <text class="title" x="36" y="50">Moving the AKS spoke /17</text>
  <text class="body" x="36" y="78">BGP control plane only: arrows show routing updates, not application traffic.</text>
  <rect x="36" y="105" width="888" height="77" rx="10" fill="#eaf1f8"/>

  <g class="vpn">
    <use href="#west-gcp"/>
    <use href="#west-onprem"/>
    <use href="#israel-gcp"/>
    <use href="#israel-onprem"/>
  </g>
  <g>
    <rect class="node hub" x="36" y="276" width="249" height="88" rx="10"/>
    <text class="heading" x="160" y="313" text-anchor="middle">West Europe</text>
    <text class="body" x="160" y="338" text-anchor="middle">Azure VPN Gateway</text>
    <rect class="node hub" x="675" y="276" width="249" height="88" rx="10"/>
    <text class="heading" x="800" y="313" text-anchor="middle">Israel Central</text>
    <text class="body" x="800" y="338" text-anchor="middle">Azure VPN Gateway</text>
    <rect class="node" x="375" y="208" width="210" height="54" rx="10"/>
    <text class="heading" x="480" y="241" text-anchor="middle">Google Cloud (GCP)</text>
    <rect class="node" x="375" y="383" width="210" height="54" rx="10"/>
    <text class="heading" x="480" y="416" text-anchor="middle">On-premises</text>
  </g>

  <g id="before" class="phase-one">
    <text class="heading" x="56" y="136">1 / Before cutover: West Europe advertises the /17</text>
    <text class="body" x="56" y="161">GCP and on-premises learn the route from West Europe.</text>
    <use href="#west-gcp" class="update"/>
    <use href="#west-onprem" class="update"/>
    <use href="#west-gcp" class="update pulse"/>
    <use href="#west-onprem" class="update pulse"/>
  </g>
  <g id="cutover" class="phase-two">
    <text class="heading" x="56" y="136">2 / Cutover: West Europe withdraws the /17</text>
    <text class="body" x="56" y="161">Confirm the old route is gone at both peers before advertising it from Israel Central.</text>
    <use href="#west-gcp" class="update withdraw"/>
    <use href="#west-onprem" class="update withdraw"/>
    <use href="#west-gcp" class="update withdraw pulse"/>
    <use href="#west-onprem" class="update withdraw pulse"/>
  </g>
  <g id="after" class="phase-three">
    <text class="heading" x="56" y="136">3 / After cutover: Israel Central advertises the same /17</text>
    <text class="body" x="56" y="161">Verify both peers select the route from Israel Central and return traffic works.</text>
    <use href="#israel-gcp" class="update"/>
    <use href="#israel-onprem" class="update"/>
    <use href="#israel-gcp" class="update pulse"/>
    <use href="#israel-onprem" class="update pulse"/>
  </g>

  <path class="vpn" d="M36 473 H60"/>
  <text class="body" x="70" y="478">S2S VPN + BGP stays up on all four links</text>
  <path d="M401 473 H425" stroke="#0078d4" stroke-width="3" marker-end="url(#advertise)"/>
  <text class="body" x="435" y="478">/17 advertisement</text>
  <path d="M603 473 H627" stroke="#9a5a00" stroke-width="3" marker-end="url(#withdraw)"/>
  <text class="body" x="637" y="478">/17 withdrawal</text>
  <path d="M36 498 H924" stroke="#bcccdc"/>
  <text class="body" x="36" y="524">West Europe advertises &#8594; West Europe withdraws &#8594; Israel Central advertises</text>
  <text class="note" x="36" y="548">Timing is illustrative; wait for route verification, not a timer. The /17 can be temporarily unreachable.</text>
  <text class="note" x="36" y="570">Other prefixes and inter-region links are outside this view.</text>
</svg>
